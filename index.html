<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2350" />
    <meta name="description" content="Cat Flap — a one-button browser game. Tap to flap, fly the cat between the scratching posts." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Cat Flap</title>
  </head>
  <body>
    <main id="app" data-phase="ready">
      <canvas id="stage" role="img"></canvas>

      <div id="frame">
        <div class="hud">
          <button type="button" class="icon-btn pause-btn" data-action="pause">
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.4" /><rect x="13.9" y="5" width="3.6" height="14" rx="1.4" /></svg>
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
          </button>
          <output class="score" aria-hidden="true">0</output>
          <p class="beat-best" aria-hidden="true"></p>
          <p class="overtake" aria-hidden="true"></p>
          <button type="button" class="icon-btn sound-btn" data-action="sound" aria-pressed="true">
            <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.5h3.2L12 5.4v13.2l-4.8-4.1H4z" /><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8" /></svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9.5h3.2L12 5.4v13.2l-4.8-4.1H4z" /><path class="wave" d="M15.5 9.5l5 5M20.5 9.5l-5 5" /></svg>
          </button>
        </div>

        <section class="screen ready-screen" aria-labelledby="title">
          <div class="door" aria-hidden="false">
            <div class="door-frame"></div>
            <div class="door-flap">
              <h1 id="title">Cat Flap</h1>
            </div>
          </div>
          <p class="tagline"></p>
          <p class="start-hint"><span class="start-main"></span> <span class="start-keys"></span></p>
          <p class="ready-best"><span class="label"></span> <b class="value">0</b></p>
          <div class="challenge" hidden>
            <p class="challenge-heading"></p>
            <p class="challenge-hint"></p>
            <ol class="rank-list challenge-list"></ol>
            <button type="button" class="text-btn exit-challenge"></button>
          </div>
        </section>

        <section class="screen paused-screen" aria-live="polite">
          <h2 class="paused-title"></h2>
          <p class="paused-hint"></p>
          <p class="countdown" aria-hidden="true"></p>
        </section>

        <section class="screen over-screen" role="status">
          <div class="card">
            <h2 class="over-title"></h2>
            <p class="quip"></p>
            <dl class="stats">
              <div><dt class="score-label"></dt><dd class="final-score">0</dd></div>
              <div><dt class="best-label"></dt><dd class="final-best">0</dd></div>
            </dl>
            <p class="new-best"></p>
            <div class="share-row">
              <input class="name-input" type="text" maxlength="24" autocomplete="nickname" enterkeyhint="done" spellcheck="false" />
              <button type="button" class="share-btn"></button>
            </div>
            <div class="standings" hidden>
              <p class="standings-label"></p>
              <ol class="rank-list standings-list"></ol>
            </div>
          </div>
          <p class="retry-hint"></p>
        </section>
        <p class="toast" role="status" aria-live="polite"></p>
      </div>
    </main>
    <noscript>Cat Flap needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
